[project]
name = "gds-vm-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pytest>=8.4,<10", "Pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --strict-markers"
markers = [
  "files: Files user workflows",
  "images: Images user workflows",
]
junit_family = "xunit2"
